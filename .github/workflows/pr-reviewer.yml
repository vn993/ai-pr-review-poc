name: Automated AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff & Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Remove any accidental spaces or newlines from the secret
          CLEAN_KEY=$(echo "$GEMINI_API_KEY" | tr -d '[:space:]')

          if [ -z "$CLEAN_KEY" ]; then
            echo "Error: GEMINI_API_KEY is empty."
            exit 1
          fi

          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)

          if [ -z "$DIFF" ]; then
            echo "No code changes detected."
            exit 0
          fi

          PROMPT="You are a senior software engineer performing a code review. Analyze the following git diff for bugs, security vulnerabilities, and performance issues. Provide concise, actionable feedback in Markdown bullet points. Here is the diff:\n\n$DIFF"
          PAYLOAD=$(jq -n --arg text "$PROMPT" '{
            contents: [{
              parts: [{ text: $text }]
            }]
          }')

          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $CLEAN_KEY" \
            -d "$PAYLOAD" \
            "https://googleapis.com")

          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW" ]; then
            echo "API Error Response: $RESPONSE"
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '## 🤖 Automated Code Review\n\n%s' "$REVIEW")"
