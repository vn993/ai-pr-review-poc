name: Automated AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff & Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Get the git diff between the base branch and PR branch
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)

          if [ -z "$DIFF" ]; then
            echo "No code changes detected."
            exit 0
          fi

          # 2. Construct the prompt and JSON payload safely with jq
          PROMPT="You are a senior software engineer performing a code review. Analyze the following git diff for bugs, security vulnerabilities, and performance issues. Provide concise, actionable feedback in Markdown bullet points. Here is the diff:\n\n$DIFF"
          PAYLOAD=$(jq -n --arg text "$PROMPT" '{
            contents: [{
              parts: [{ text: $text }]
            }]
          }')

          # 3. Call the free Gemini API
          RESPONSE=$(curl -s -X POST \
            "https://googleapis.com{GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          # 4. Extract the review text
          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Error: Could not generate review."')

          # 5. Post the review comment directly onto the Pull Request
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "## 🤖 Automated Code Review\n\n$REVIEW"
