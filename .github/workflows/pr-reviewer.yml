name: Automated AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff & Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          if [ ! -s pr.diff ]; then
            echo "No code changes detected."
            exit 0
          fi

          python3 - << 'EOF'
          import os, json, urllib.request, urllib.error, subprocess

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("ERROR: GEMINI_API_KEY secret is missing or empty.")
              exit(1)

          with open("pr.diff", "r", encoding="utf-8", errors="ignore") as f:
              diff = f.read()

          prompt = (
              "You are a senior software engineer performing a code review. "
              "Analyze the following git diff for bugs, security vulnerabilities, and performance issues. "
              "Provide concise, actionable feedback in Markdown bullet points.\n\n" + diff
          )

          base = "https://generativelanguage.googleapis.com"
          models = ["gemini-3.8-flash", "gemini-3.5-flash-lite"]
          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": api_key
          }
          payload = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}]
          }).encode("utf-8")

          review = None
          for model in models:
              url = f"{base}/v1beta/models/{model}:generateContent"
              req = urllib.request.Request(url, data=payload, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                      candidate = body["candidates"].pop(0)
                      part = candidate["content"]["parts"].pop(0)
                      review = part["text"]
                      break
              except urllib.error.HTTPError as e:
                  err_msg = e.read().decode("utf-8", errors="ignore")
                  print(f"Model {model} returned HTTP {e.code}: {err_msg}")
                  if e.code in (429, 503):
                      continue
                  exit(1)

          if not review:
              print("Failed to get a review from available models.")
              exit(1)

          comment_body = f"## 🤖 Automated Code Review\n\n{review}"
          subprocess.run([
              "gh", "pr", "comment", os.environ["PR_NUMBER"],
              "--repo", os.environ["REPO"],
              "--body", comment_body
          ], check=True)
          EOF
